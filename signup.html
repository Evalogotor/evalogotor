    body {

        opacity: 0;
        pointer-events: none;
    }

    body.light input[type="text"],

        background-color: #007BFF;

        padding: 10px 20px;

        transition: all 0.3s ease;

    }

    #continueBtn:disabled {

let darkMode = true;
let currentLang = localStorage.getItem("lang") || "en";
const savedTheme = localStorage.getItem("theme") || "dark";
const SIGNUP_DEVICE_ID_KEY = "evalogotor_signup_device_id";
let signupChallengeToken = "";

function t(key) {
    return (translations[currentLang] || translations.en)[key];
}

function updateLanguage(lang) {
    currentLang = lang;
    document.getElementById("title").textContent = t("title");
    document.getElementById("usernameLabel").textContent = t("username");
    document.getElementById("emailLabel").textContent = t("email");
    document.getElementById("passwordLabel").textContent = t("password");
    document.getElementById("password2Label").textContent = t("password2");
    document.getElementById("alreadyText").textContent = t("already");
    document.getElementById("loginLink").textContent = t("login");
    document.getElementById("username").placeholder = t("placeholderUser");
    document.getElementById("email").placeholder = t("placeholderEmail");
    document.getElementById("password").placeholder = t("placeholderPass");
    document.getElementById("password2").placeholder = t("placeholderPass2");
    document.getElementById("captchaLabel").textContent = t("captchaLabel");
    document.getElementById("captchaAnswer").placeholder = t("placeholderCaptcha");
    document.getElementById("captchaRefreshBtn").textContent = t("captchaRefresh");
    if (!signupChallengeToken) {
        document.getElementById("captchaQuestion").textContent = t("captchaLoading");
    }
    document.getElementById("verificationLabel").textContent = t("verificationLabel");
    document.getElementById("verificationCode").placeholder = t("placeholderCode");
    document.getElementById("continueBtn").textContent = t("continue");
}

function applyTheme() {
    if (darkMode) {
        document.body.classList.remove("light");
        document.body.classList.add("dark");
        document.getElementById("themeIcon").setAttribute("data-lucide", "sun");
    } else {
        document.body.classList.add("light");
        document.body.classList.remove("dark");
        document.getElementById("themeIcon").setAttribute("data-lucide", "moon");
    }
    lucide.createIcons();
}

function showMessage(message, type = "error") {
    document.getElementById("warning").innerHTML =
        `<div class="message ${type}"><span>${type === "success" ? "✓" : "!"}</span><span>${message}</span></div>`;
}

function clearMessage() {
    document.getElementById("warning").innerHTML = "";
}

function resetVerificationState() {
    document.getElementById("verificationWrap").style.display = "none";
    document.getElementById("verificationCode").value = "";
    document.getElementById("continueBtn").textContent = t("continue");
}

function getOrCreateSignupDeviceId() {
    let deviceId = localStorage.getItem(SIGNUP_DEVICE_ID_KEY) || "";
    if (!deviceId) {
        if (window.crypto && window.crypto.randomUUID) {
            deviceId = window.crypto.randomUUID().replace(/-/g, "");
        } else {
            deviceId = `${Date.now().toString(36)}${Math.random().toString(36).slice(2)}`;
        }
        localStorage.setItem(SIGNUP_DEVICE_ID_KEY, deviceId);
    }
    return deviceId;
}

async function sha256Hex(input) {
    if (!(window.crypto && crypto.subtle && window.TextEncoder)) {
        let hash = 0;
        for (let index = 0; index < input.length; index += 1) {
            hash = ((hash << 5) - hash + input.charCodeAt(index)) | 0;
        }
        return Math.abs(hash).toString(16);
    }
    const encoder = new TextEncoder();
    const bytes = encoder.encode(input);
    const digest = await crypto.subtle.digest("SHA-256", bytes);
    return Array.from(new Uint8Array(digest)).map((value) => value.toString(16).padStart(2, "0")).join("");
}

async function buildSignupDevicePayload() {
    const nav = navigator || {};
    const screenInfo = window.screen || {};
    const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone || "";
    const modelBits = [
        nav.userAgent || "",
        nav.platform || "",
        nav.language || "",
        String(nav.hardwareConcurrency || ""),
        String(screenInfo.width || ""),
        String(screenInfo.height || ""),
        String(screenInfo.colorDepth || ""),
        timezone
    ];
    const fingerprint = await sha256Hex(modelBits.join("|"));
    const deviceLabel = [nav.platform || "browser", nav.language || "", timezone].filter(Boolean).join(" | ");
    return {
        device_id: getOrCreateSignupDeviceId(),
        device_fingerprint: fingerprint,
        device_label: deviceLabel.slice(0, 255)
    };
}

async function loadSignupChallenge() {
    signupChallengeToken = "";
    document.getElementById("captchaQuestion").textContent = t("captchaLoading");
    try {
        const data = await window.EvalogotorApi.apiRequest("/api/auth/signup/challenge", {
            method: "GET",
            auth: false,
            cache: "no-store"
        });
        signupChallengeToken = data.token || "";
        document.getElementById("captchaQuestion").textContent = data.question || t("captchaLoading");
        document.getElementById("captchaAnswer").value = "";
    } catch (_error) {
        document.getElementById("captchaQuestion").textContent = t("captchaLoading");
    }
}

function refreshSignupChallenge() {
    clearMessage();
    loadSignupChallenge();
}

function validateFields(username, email, password, password2) {
    if (username.length < 3) {
        return t("warnUser");
    }
    if (!email.includes("@") || !email.includes(".")) {
        return t("warnEmail");
    }
    if (password.length < 6) {
        return t("warnPass");
    }
    if (password2.length === 0) {
        return t("warnPass2");
    }
    if (password !== password2) {
        return t("warnMismatch");
    }
    if (!document.getElementById("captchaAnswer").value.trim()) {
        return t("warnCaptcha");
    }
    return "";
}

async function filledYet() {
    clearMessage();

    const username = document.getElementById("username").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const password2 = document.getElementById("password2").value;
    const website = document.getElementById("website").value.trim();
    const captchaAnswer = document.getElementById("captchaAnswer").value.trim();

    const validationError = validateFields(username, email, password, password2);
    if (validationError) {
        showMessage(validationError);
        return;
    }

    const continueBtn = document.getElementById("continueBtn");
    const originalLabel = continueBtn.textContent;
    continueBtn.disabled = true;
    continueBtn.textContent = t("creating");

    try {
        if (!signupChallengeToken) {
            await loadSignupChallenge();
        }
        const devicePayload = await buildSignupDevicePayload();
        const data = await window.EvalogotorApi.apiRequest("/api/auth/signup", {
            method: "POST",
            auth: false,
            body: {
                username,
                email,
                password,
                website,
                challenge_token: signupChallengeToken,
                challenge_answer: captchaAnswer,
                ...devicePayload
            }
        });

        window.EvalogotorApi.setAuthSession({
            token: data.token,
            user: data.user
        });

        window.location.href = "account";
    } catch (error) {
        showMessage(window.EvalogotorApi.getFriendlyErrorMessage(error));
        await loadSignupChallenge();
        continueBtn.disabled = false;
        continueBtn.textContent = originalLabel;
    }
}

function goHome() {
    window.location.href = "/";
}

document.getElementById("langSelect").value = currentLang;
updateLanguage(currentLang);
loadSignupChallenge();

darkMode = savedTheme === "dark";
applyTheme();

document.getElementById("langSelect").addEventListener("change", (event) => {
    currentLang = event.target.value;
    localStorage.setItem("lang", currentLang);
    updateLanguage(currentLang);
});

document.getElementById("themeToggle").addEventListener("click", () => {
    darkMode = !darkMode;
    localStorage.setItem("theme", darkMode ? "dark" : "light");
    applyTheme();
});

["username", "email", "password", "password2", "captchaAnswer"].forEach((id) => {
    document.getElementById(id).addEventListener("input", () => {
        clearMessage();
    });
});

["username", "email", "password", "password2", "captchaAnswer"].forEach((id) => {
    document.getElementById(id).addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
            filledYet();
        }
    });
});

const existingSession = window.EvalogotorApi.getAuthSession();
if (existingSession && existingSession.token) {
    window.location.href = "account";
}
</script>
</body>
</html>
