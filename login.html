<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EVALOGOTOR - Login</title>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="api-client.js"></script>
<style>
    body {
        font-family: Arial, sans-serif;
        text-align: center;
        background-color: rgb(17, 24, 39);
        color: rgb(200, 200, 200);
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        transition: all 0.3s ease;
    }

    body.light {
        background-color: rgb(245, 245, 245);
        color: #000000;
    }

    .container {
        background-color: rgb(31, 41, 55);
        border-radius: 20px;
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        padding: 64px;
        text-align: center;
        width: min(90%, 760px);
        position: relative;
        transition: all 0.3s ease;
    }

    body.light .container {
        background-color: #f0f0f0;
        color: #000;
    }

    h1 {
        font-size: 3em;
        margin-top: 32px;
        margin-bottom: 32px;
    }

    .input-container {
        display: flex;
        flex-direction: row;
        align-items: center;
        justify-content: center;
        margin-top: 20px;
        gap: 12px;
    }

    label {
        font-size: 1.1em;
        min-width: 110px;
        text-align: right;
    }

    input[type="text"],
    input[type="password"] {
        font-size: 1em;
        padding: 10px;
        border: 2px solid rgb(17, 24, 39);
        border-radius: 5px;
        width: min(80%, 320px);
        background-color: rgb(55, 65, 81);
        color: white;
        transition: all 0.3s ease;
    }

    body.light input[type="text"],
    body.light input[type="password"] {
        background-color: #fff;
        color: #000;
        border: 2px solid #ccc;
    }

    input:focus {
        border-color: #007BFF;
        outline: none;
    }

    .button-container {
        margin-top: 24px;
    }

    #continueBtn {
        background-color: #007BFF;
        color: white;
        border: none;
        padding: 10px 20px;
        margin: 10px;
        font-size: 1em;
        cursor: pointer;
        border-radius: 5px;
        transition: all 0.3s ease;
    }

    #continueBtn:hover {
        background-color: #0056b3;
    }

    #continueBtn:disabled {
        opacity: 0.7;
        cursor: wait;
    }

    body.light #continueBtn:hover {
        background-color: #c0c0c0;
        color: #000;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    }

    .message {
        padding: 12px 16px;
        border-radius: 16px;
        margin: 16px auto 0;
        font-family: system-ui, sans-serif;
        font-size: 15px;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
        display: flex;
        align-items: center;
        gap: 10px;
        max-width: 420px;
        text-align: left;
    }

    .message.error {
        background-color: #fff4f4;
        color: #d32f2f;
        border: 1px solid #f8d7da;
    }

    .message.info {
        background-color: #eef6ff;
        color: #0b57d0;
        border: 1px solid #c9defa;
    }

    .topbar {
        display: flex;
        justify-content: flex-end;
        align-items: center;
        gap: 10px;
        position: absolute;
        top: 20px;
        right: 20px;
    }

    select {
        padding: 6px 10px;
        border-radius: 6px;
        border: 1px solid rgb(55, 65, 81);
        background-color: rgb(55, 65, 81);
        color: rgb(220, 220, 220);
        font-size: 0.9em;
        cursor: pointer;
    }

    button.themeToggle {
        padding: 10px 10px 5px 10px;
        border-radius: 6px;
        border: 1px solid rgb(55, 65, 81);
        background-color: rgb(55, 65, 81);
        color: white;
        cursor: pointer;
    }

    body.light select,
    body.light button.themeToggle {
        background-color: #fff;
        color: #000;
        border: 1px solid #ccc;
    }

    .homeButton {
        position: absolute;
        top: 20px;
        left: 20px;
        padding: 10px 10px 5px 10px;
        border-radius: 6px;
        border: 1px solid rgb(55, 65, 81);
        background-color: rgb(55, 65, 81);
        color: white;
        cursor: pointer;
    }

    body.light .homeButton {
        background-color: #fff;
        color: #000;
        border: 1px solid #ccc;
    }

    .homeButton:hover {
        opacity: 0.8;
    }

    #noAccountText {
        margin-top: 24px;
    }

    #signupLink {
        color: #3b82f6;
        text-decoration: none;
        font-weight: bold;
        margin-left: 6px;
        transition: 0.2s;
    }
</style>
</head>
<body>
    <div class="container">
        <button class="homeButton" onclick="goHome()">
            <i data-lucide="home"></i>
        </button>

        <div class="topbar">
            <select id="langSelect">
                <option value="en">EN</option>
                <option value="de">DE</option>
                <option value="it">IT</option>
                <option value="hr">HR</option>
                <option value="fr">FR</option>
                <option value="ru">RU</option>
            </select>
            <button class="themeToggle" id="themeToggle">
                <i id="themeIcon" data-lucide="moon"></i>
            </button>
        </div>

        <h1 id="title">Login</h1>

        <div class="input-container">
            <label for="username" id="usernameLabel">Username</label>
            <input type="text" id="username" name="username" placeholder="Enter username" autocomplete="username">
        </div>

        <div class="input-container">
            <label for="password" id="passwordLabel">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter password" autocomplete="current-password">
        </div>

        <div class="button-container">
            <button id="continueBtn" onclick="filledYet()">Continue</button>
        </div>

        <div id="warning"></div>

        <p id="noAccountText">
            Need an account?
            <a href="signup" id="signupLink">Sign up</a>
        </p>
    </div>

<script>
lucide.createIcons();

const translations = {
    en: {
        title: "Login",
        username: "Username",
        password: "Password",
        placeholderUser: "Enter username or email",
        placeholderPass: "Enter password",
        continue: "Continue",
        warnUser: "Please enter your username or email",
        warnPass: "Please enter your password",
        noAccount: "Need an account?",
        signup: "Sign up",
        signingIn: "Signing in..."
    },
    de: {
        title: "Anmelden",
        username: "Benutzername",
        password: "Passwort",
        placeholderUser: "Benutzername oder E-Mail eingeben",
        placeholderPass: "Passwort eingeben",
        continue: "Weiter",
        warnUser: "Bitte Benutzernamen oder E-Mail eingeben",
        warnPass: "Bitte Passwort eingeben",
        noAccount: "Noch kein Konto?",
        signup: "Registrieren",
        signingIn: "Anmeldung..."
    },
    it: {
        title: "Accesso",
        username: "Nome utente",
        password: "Password",
        placeholderUser: "Inserisci nome utente o email",
        placeholderPass: "Inserisci password",
        continue: "Continua",
        warnUser: "Inserisci nome utente o email",
        warnPass: "Inserisci la password",
        noAccount: "Non hai un account?",
        signup: "Registrati",
        signingIn: "Accesso in corso..."
    },
    hr: {
        title: "Prijava",
        username: "Korisnicko ime",
        password: "Lozinka",
        placeholderUser: "Upisite korisnicko ime ili email",
        placeholderPass: "Upisite lozinku",
        continue: "Nastavi",
        warnUser: "Molim unesite korisnicko ime ili email",
        warnPass: "Molim unesite lozinku",
        noAccount: "Nemate racun?",
        signup: "Registriraj se",
        signingIn: "Prijava..."
    },
    fr: {
        title: "Connexion",
        username: "Nom d'utilisateur",
        password: "Mot de passe",
        placeholderUser: "Entrez nom d'utilisateur ou email",
        placeholderPass: "Entrez mot de passe",
        continue: "Continuer",
        warnUser: "Veuillez entrer le nom d'utilisateur ou l'email",
        warnPass: "Veuillez entrer le mot de passe",
        noAccount: "Pas encore de compte ?",
        signup: "S'inscrire",
        signingIn: "Connexion..."
    },
    ru: {
        title: "Vhod",
        username: "Polzovatel",
        password: "Parol",
        placeholderUser: "Vvedite imya ili email",
        placeholderPass: "Vvedite parol",
        continue: "Prodolzhit",
        warnUser: "Pozhaluysta, vvedite imya ili email",
        warnPass: "Pozhaluysta, vvedite parol",
        noAccount: "Net akkaunta?",
        signup: "Registratsiya",
        signingIn: "Vhod..."
    }
};

let darkMode = true;
let currentLang = localStorage.getItem("lang") || "en";
const savedTheme = localStorage.getItem("theme") || "dark";

function t(key) {
    return (translations[currentLang] || translations.en)[key];
}

function updateLanguage(lang) {
    currentLang = lang;
    document.getElementById("title").textContent = t("title");
    document.getElementById("usernameLabel").textContent = t("username");
    document.getElementById("passwordLabel").textContent = t("password");
    document.getElementById("username").placeholder = t("placeholderUser");
    document.getElementById("password").placeholder = t("placeholderPass");
    document.getElementById("continueBtn").textContent = t("continue");
    document.getElementById("noAccountText").childNodes[0].textContent = t("noAccount") + " ";
    document.getElementById("signupLink").textContent = t("signup");
}

function applyTheme() {
    if (darkMode) {
        document.body.classList.remove("light");
        document.body.classList.add("dark");
        document.getElementById("themeIcon").setAttribute("data-lucide", "sun");
    } else {
        document.body.classList.add("light");
        document.body.classList.remove("dark");
        document.getElementById("themeIcon").setAttribute("data-lucide", "moon");
    }
    lucide.createIcons();
}

function goHome() {
    window.location.href = "/";
}

function showMessage(message, type = "error") {
    document.getElementById("warning").innerHTML =
        `<div class="message ${type}"><span>${type === "error" ? "!" : "i"}</span><span>${message}</span></div>`;
}

function clearMessage() {
    document.getElementById("warning").innerHTML = "";
}

function notFilled(username, password) {
    if (username.trim() === "") {
        showMessage(t("warnUser"));
        return;
    }
    if (password.trim() === "") {
        showMessage(t("warnPass"));
    }
}

async function filledYet() {
    clearMessage();

    const username = document.getElementById("username").value;
    const password = document.getElementById("password").value;

    if (username.trim() === "" || password.trim() === "") {
        notFilled(username, password);
        return;
    }

    const continueBtn = document.getElementById("continueBtn");
    const originalLabel = continueBtn.textContent;
    continueBtn.disabled = true;
    continueBtn.textContent = t("signingIn");

    try {
        const data = await window.EvalogotorApi.apiRequest("/api/auth/login", {
            method: "POST",
            auth: false,
            body: {
                username,
                password
            }
        });

        window.EvalogotorApi.setAuthSession({
            token: data.token,
            user: data.user
        });

        localStorage.setItem("evalogotorSavedUsername", data.user.username);
        window.location.href = "account";
    } catch (error) {
        showMessage(window.EvalogotorApi.getFriendlyErrorMessage(error));
        continueBtn.disabled = false;
        continueBtn.textContent = originalLabel;
    }
}

document.getElementById("langSelect").value = currentLang;
updateLanguage(currentLang);

darkMode = savedTheme === "dark";
applyTheme();

document.getElementById("langSelect").addEventListener("change", (event) => {
    currentLang = event.target.value;
    localStorage.setItem("lang", currentLang);
    updateLanguage(currentLang);
    applyTheme();
});

document.getElementById("themeToggle").addEventListener("click", () => {
    darkMode = !darkMode;
    localStorage.setItem("theme", darkMode ? "dark" : "light");
    applyTheme();
    updateLanguage(currentLang);
});

document.getElementById("username").addEventListener("keydown", (event) => {
    if (event.key === "Enter") {
        filledYet();
    }
});

document.getElementById("password").addEventListener("keydown", (event) => {
    if (event.key === "Enter") {
        filledYet();
    }
});

const savedUsername = localStorage.getItem("evalogotorSavedUsername");
if (savedUsername) {
    document.getElementById("username").value = savedUsername;
}

const existingSession = window.EvalogotorApi.getAuthSession();
if (existingSession && existingSession.token) {
    window.location.href = "account";
}
</script>
</body>
</html>
